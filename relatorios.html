<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Relatórios — Banco de Horas</title><style>body{font-family:Arial,sans-serif;background:#f6f7f9;color:#111827;margin:0;padding:24px}.wrap{max-width:1200px;margin:auto}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input,.toolbar select,.toolbar button{padding:9px;border:1px solid #d1d5db;border-radius:8px;background:#fff}.toolbar button{cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.table{width:100%;border-collapse:collapse;margin-top:16px}.table th,.table td{padding:10px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Relatórios</h1><p>Consulta os dados reais da API do Banco de Horas.</p><div class="card"><div class="toolbar"><select id="tipo"><option value="espelho-ponto">Espelho de ponto</option><option value="banco-horas">Banco de horas</option><option value="ferias">Férias</option><option value="folgas">Folgas</option><option value="fechamento">Fechamento mensal</option><option value="atrasos">Atrasos</option></select><input id="competencia" type="month"><input id="colaboradorId" placeholder="ID do colaborador"><button id="gerar">Gerar</button></div></div><div id="resultado" class="card"><p>Selecione um relatório.</p></div></div><script type="module">import { relatoriosController } from './web/relatorios-controller.js';import { renderRelatorio } from './web/relatorios-view.js';const tipo=document.querySelector('#tipo');const competencia=document.querySelector('#competencia');const colaboradorId=document.querySelector('#colaboradorId');const resultado=document.querySelector('#resultado');const params=()=>({competencia:competencia.value||new Date().toISOString().slice(0,7),colaboradorId:colaboradorId.value.trim()||undefined});document.querySelector('#gerar').addEventListener('click',async()=>{try{const state=await relatoriosController.load(tipo.value,params());renderRelatorio(state,resultado)}catch(error){renderRelatorio(relatoriosController.getState(),resultado)}});</script></body></html>
