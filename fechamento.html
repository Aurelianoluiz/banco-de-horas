<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fechamento — Banco de Horas</title><style>body{margin:0;background:#f6f7f9;color:#111827;font:14px Arial}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-bottom:16px}.form{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.form label{font-size:12px;color:#6b7280}.form input,.form select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:9px;border:1px solid #d1d5db;border-radius:7px}.btn{margin-top:16px;padding:10px 14px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.error{color:#dc2626;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{border:1px solid #e5e7eb;border-radius:10px;padding:14px}.kpi b{display:block;font-size:20px;margin-top:6px}@media(max-width:700px){.form,.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Fechamento mensal</h1><p>Conferência e fechamento da competência.</p><section class="card"><div class="form"><label>Colaborador<select id="colaborador"></select></label><label>Competência<input id="competencia" type="month"></label><label>Saldo anterior (min)<input id="saldoAnterior" type="number" value="0"></label></div><button id="consultar" class="btn">Consultar</button><button id="fechar" class="btn" style="margin-left:8px">Fechar competência</button><div id="error" class="error"></div></section><section id="resumo" class="card" hidden><div class="grid"><div class="kpi">Créditos<b id="creditos">0</b></div><div class="kpi">Débitos<b id="debitos">0</b></div><div class="kpi">Saldo anterior<b id="anterior">0</b></div><div class="kpi">Saldo final<b id="final">0</b></div></div></section></main><script type="module">import { api } from './web/api-client.js';import { authSession } from './web/auth-session.js';if(!authSession.requireAuth()){}const el=(id)=>document.getElementById(id);const cols=el('colaborador');const error=el('error');const month=el('competencia');const money=(v)=>`${Number(v||0)} min`;month.value=new Date().toISOString().slice(0,7);async function load(){const rows=await api.list('colaboradores');cols.innerHTML=rows.map(c=>`<option value="${c.id}">${String(c.nome||'').replace(/[&<>]/g,'')}</option>`).join('');}async function resumo(){error.textContent='';try{const r=await api.relatorio('fechamento',{colaboradorId:cols.value,competencia:month.value});el('resumo').hidden=false;el('creditos').textContent=money(r.creditos);el('debitos').textContent=money(r.debitos);el('anterior').textContent=money(0);el('final').textContent=money(Number(r.creditos||0)-Number(r.debitos||0));}catch(e){error.textContent=e.message}}async function fechar(){error.textContent='';try{const r=await api.fechar(month.value,cols.value,Number(el('saldoAnterior').value||0));el('resumo').hidden=false;el('creditos').textContent=money(r.creditos);el('debitos').textContent=money(r.debitos);el('anterior').textContent=money(r.saldoAnterior);el('final').textContent=money(r.saldoFinal);alert('Competência fechada com sucesso.')}catch(e){error.textContent=e.message}}el('consultar').addEventListener('click',resumo);el('fechar').addEventListener('click',fechar);load().catch(e=>error.textContent=e.message);</script></body></html>
