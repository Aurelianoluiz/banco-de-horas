<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ausências — Banco de Horas</title><style>body{font:14px Arial;background:#f6f7f9;color:#111827;margin:0;padding:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;padding:9px;border-bottom:1px solid #e5e7eb}.muted{color:#6b7280}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>Férias, Folgas e Feriados</h1><p id="status" class="muted">Carregando…</p><div id="content" class="grid"></div></main><script type="module">import { authSession } from './web/auth-session.js';import { absenceController } from './web/absence-controller.js';import { renderFerias, renderFolgas, renderFeriados } from './web/ausencias-view.js';authSession.requireAuth();const status=document.getElementById('status');const content=document.getElementById('content');try{const state=await absenceController.load();content.innerHTML=`<div class="card">${renderFerias(state.ferias)}</div><div class="card">${renderFolgas(state.folgas)}</div><div class="card">${renderFeriados(state.feriados)}</div>`;status.textContent=`${state.ferias.length} férias · ${state.folgas.length} folgas · ${state.feriados.length} feriados`;}catch(error){status.textContent=error.message||'Erro ao carregar ausências.';status.style.color='#dc2626';}</script></body></html>
