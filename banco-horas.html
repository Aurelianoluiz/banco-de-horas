<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Banco de Horas</title></head><body><main><h1>Banco de Horas</h1><form id="filters"><label>Competência <input id="competencia" type="month" required></label><label>Colaborador <select id="colaborador"><option value="">Todos</option></select></label><button>Consultar</button></form><section id="resultado"></section></main><script type="module">import { bancoHorasController } from './web/banco-horas-controller.js'; import { renderBancoHoras } from './web/banco-horas-view.js';
const competencia=document.querySelector('#competencia'); const colaborador=document.querySelector('#colaborador'); const resultado=document.querySelector('#resultado');
competencia.value=new Date().toISOString().slice(0,7);
async function carregarColaboradores(){ const state=await bancoHorasController.load({competencia:competencia.value}); colaborador.innerHTML='<option value="">Todos</option>'+state.colaboradores.map(c=>`<option value="${c.id}">${String(c.nome||'').replace(/[&<>\"']/g, '')}</option>`).join(''); renderBancoHoras(state,resultado); }
async function consultar(){ try { const state=await bancoHorasController.load({competencia:competencia.value,colaboradorId:colaborador.value||undefined}); renderBancoHoras(state,resultado); } catch (error) { renderBancoHoras({...bancoHorasController.getState(),error},resultado); } }
document.querySelector('#filters').addEventListener('submit',(event)=>{event.preventDefault();consultar();}); carregarColaboradores();
</script></body></html>
