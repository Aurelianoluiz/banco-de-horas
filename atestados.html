<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atestados — Banco de Horas</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/web/responsive.css"></head><body><main class="main"><h1>Atestados</h1><form id="f" class="card"><input id="colaboradorId" placeholder="ID do colaborador" required><input id="inicio" type="date" required><input id="fim" type="date" required><input id="motivo" placeholder="Motivo"><select id="status"><option>Pendente</option><option>Aprovado</option><option>Rejeitado</option><option>Cancelado</option></select><button>Salvar</button><p id="msg" aria-live="polite"></p></form><section class="card"><button id="load">Atualizar</button><pre id="list"></pre></section><script type="module">const load=async()=>{const r=await fetch('/api/atestados');list.textContent=JSON.stringify(await r.json(),null,2)};f.onsubmit=async e=>{e.preventDefault();const body={colaboradorId:colaboradorId.value,inicio:inicio.value,fim:fim.value,motivo:motivo.value,status:status.value};const r=await fetch('/api/atestados',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});msg.textContent=r.ok?'Atestado salvo.':(await r.json()).error;await load()};load.onclick=load;load();</script></main></body></html>
