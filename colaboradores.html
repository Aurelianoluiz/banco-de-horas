<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Colaboradores — Banco de Horas</title><style>body{font:14px Arial;margin:0;background:#f6f7f9;color:#111827}.wrap{max-width:1100px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.btn{border:1px solid #d1d5db;border-radius:8px;padding:9px 13px;background:#fff;cursor:pointer}.primary{background:#2563eb;color:#fff;border-color:#2563eb}table{width:100%;border-collapse:collapse;background:#fff;border:1px solid #e5e7eb;border-radius:12px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}th{font-size:11px;color:#6b7280}.muted{color:#6b7280}.error{color:#dc2626}.actions{display:flex;gap:8px}form{display:none;background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:18px}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.form label{font-size:12px;color:#6b7280}.form input,.form select{display:block;width:100%;box-sizing:border-box;margin-top:5px;padding:9px;border:1px solid #d1d5db;border-radius:7px}.full{grid-column:1/-1}@media(max-width:700px){.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><h1>Colaboradores</h1><p class="muted">Cadastro e parâmetros individuais</p></div><button id="new" class="btn primary">+ Novo</button></div><form id="form"><div class="form"><label class="full">Nome<input id="nome" required></label><label>Salário<input id="salario" type="number" min="0" step="0.01"></label><label>Seg-Qui<input id="seg" type="time" value="09:00"></label><label>Sexta<input id="sex" type="time" value="08:00"></label><label>Tolerância<input id="tol" type="time" value="00:15"></label><label>Status<select id="status"><option value="ativo">Ativo</option><option value="inativo">Inativo</option></select></label></div><p id="formError" class="error"></p><button type="submit" class="btn primary">Salvar</button> <button type="button" id="cancel" class="btn">Cancelar</button></form><section id="content">Carregando…</section></main><script type="module">import { authSession } from './web/auth-session.js';import { colaboradoresController } from './web/colaboradores-controller.js';import { renderColaboradores } from './web/colaboradores-view.js';authSession.requireAuth();const content=document.getElementById('content'),form=document.getElementById('form'),error=document.getElementById('formError');let editId=null;const render=()=>{content.innerHTML=renderColaboradores(colaboradoresController.getState());};const load=async()=>{try{await colaboradoresController.load()}catch{}render()};document.getElementById('new').onclick=()=>{editId=null;form.reset();document.getElementById('seg').value='09:00';document.getElementById('sex').value='08:00';document.getElementById('tol').value='00:15';error.textContent='';form.style.display='block'};document.getElementById('cancel').onclick=()=>form.style.display='none';form.addEventListener('submit',async(e)=>{e.preventDefault();error.textContent='';try{await colaboradoresController.save({nome:nome.value,salario:Number(salario.value||0),seg:seg.value,sex:sex.value,tol:tol.value,active:status.value==='ativo'},editId);form.style.display='none';render()}catch(err){error.textContent=err.message||'Não foi possível salvar.'}});load();</script></body></html>
