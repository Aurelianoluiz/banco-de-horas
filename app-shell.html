<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/web/responsive.css"><title>Banco de Horas</title></head>
<body>
  <aside class="sidebar"><div class="brand">BH<span>Banco de Horas</span></div><nav class="nav" aria-label="Principal">
    <a class="active" href="/"><span class="icon">⌂</span><span>Dashboard</span></a><a href="/apontamentos.html"><span class="icon">◷</span><span>Apontamentos</span></a><a href="/banco-horas.html"><span class="icon">◒</span><span>Banco de Horas</span></a><a href="/colaboradores.html"><span class="icon">♙</span><span>Colaboradores</span></a><a href="/ausencias.html"><span class="icon">○</span><span>Férias/Folgas</span></a><a href="/calendario.html"><span class="icon">□</span><span>Calendário</span></a><a href="/fechamento.html"><span class="icon">✓</span><span>Fechamento</span></a><a href="/relatorios.html"><span class="icon">▤</span><span>Relatórios</span></a><a href="/auditoria.html"><span class="icon">⌘</span><span>Auditoria</span></a><a href="/configuracoes.html"><span class="icon">⚙</span><span>Configurações</span></a><a href="/ajustes.html"><span class="icon">✎</span><span>Ajustes</span></a><a href="/atestados.html"><span class="icon">+</span><span>Atestados</span></a>
  </nav></aside>
  <main class="main"><div class="topbar"><div><h1>Dashboard</h1><p>Visão geral da jornada e do banco de horas.</p></div><div class="actions"><a class="btn" href="/apontamentos.html">Apontamentos</a><a class="btn primary" href="/colaboradores.html">Colaboradores</a></div></div>
    <section id="dashboard-root" aria-live="polite"><p class="muted">Carregando dashboard...</p></section>
    <section class="module card"><h2>Banco de Horas</h2><form id="bank-filters" class="toolbar"><input id="bank-competencia" type="month" required><select id="bank-colaborador"><option value="">Todos</option></select><button class="btn primary">Consultar</button></form><div id="bank-root"><p class="muted">Carregando...</p></div></section>
  </main>
  <script type="module">
    import { dashboardController } from '/web/dashboard-controller.js'; import { renderDashboard } from '/web/dashboard-view.js'; import { bancoHorasController } from '/web/banco-horas-controller.js'; import { renderBancoHoras } from '/web/banco-horas-view.js';
    const dashboardRoot=document.querySelector('#dashboard-root'),bankRoot=document.querySelector('#bank-root'),competencia=document.querySelector('#bank-competencia'),colaborador=document.querySelector('#bank-colaborador'); competencia.value=new Date().toISOString().slice(0,7);
    try{await dashboardController.load({competencia:competencia.value});}catch(_){} renderDashboard(dashboardController.getState(),dashboardRoot);
    try{const state=await bancoHorasController.load({competencia:competencia.value}); colaborador.innerHTML='<option value="">Todos</option>'+state.colaboradores.map(item=>`<option value="${String(item.id).replace(/[&<>\"']/g,'')}">${String(item.nome||'—').replace(/[&<>\"']/g,'')}</option>`).join(''); renderBancoHoras(state,bankRoot);}catch(error){renderBancoHoras({...bancoHorasController.getState(),error},bankRoot);}
    document.querySelector('#bank-filters').addEventListener('submit',async event=>{event.preventDefault();try{const state=await bancoHorasController.load({competencia:competencia.value,colaboradorId:colaborador.value||undefined});renderBancoHoras(state,bankRoot);}catch(error){renderBancoHoras({...bancoHorasController.getState(),error},bankRoot);}});
  </script>
</body></html>
