<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — Banco de Horas</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f6f7f9;font:14px Arial;color:#111827}.card{width:min(390px,92vw);background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:28px;box-shadow:0 12px 40px #11182712}h1{margin:0 0 8px}.muted{color:#6b7280;font-size:12px;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;font-size:12px;color:#6b7280;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d1d5db;border-radius:8px}.btn{width:100%;padding:10px;border:0;border-radius:8px;background:#2563eb;color:#fff;cursor:pointer}.error{min-height:20px;color:#dc2626;font-size:12px;margin:10px 0}.loading{opacity:.65;pointer-events:none}</style></head><body><main class="card"><h1>Banco de Horas</h1><p class="muted">Entre com sua conta para continuar.</p><form id="loginForm"><div class="field"><label for="email">E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label for="senha">Senha</label><input id="senha" type="password" autocomplete="current-password" required></div><div id="error" class="error" role="alert"></div><button id="submit" class="btn" type="submit">Entrar</button></form></main><script type="module">import { api } from './web/api-client.js';import { authSession } from './web/auth-session.js';if(authSession.isAuthenticated())location.replace('/');const form=document.getElementById('loginForm');const error=document.getElementById('error');const button=document.getElementById('submit');form.addEventListener('submit',async(event)=>{event.preventDefault();error.textContent='';button.textContent='Entrando…';form.classList.add('loading');try{const result=await api.login(document.getElementById('email').value.trim(),document.getElementById('senha').value);authSession.set(result);location.replace('/');}catch(err){error.textContent=err.message||'Não foi possível entrar.';}finally{button.textContent='Entrar';form.classList.remove('loading');}});</script></body></html>
