<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Auditoria — Banco de Horas</title><style>body{margin:0;background:#f6f7f9;color:#111827;font:14px Arial}.wrap{max-width:1100px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid #e5e7eb;font-size:12px;vertical-align:top}.muted{color:#6b7280}.error{color:#dc2626}.filters{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;margin-bottom:16px}.filters input,.filters select,.btn{padding:9px;border:1px solid #d1d5db;border-radius:7px}.btn{background:#2563eb;color:#fff;border:0}@media(max-width:800px){.filters{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Auditoria</h1><p class="muted">Histórico somente para consulta.</p><section class="card"><div class="filters"><input id="entidade" placeholder="Entidade"><input id="registro" placeholder="ID do registro"><input id="usuario" placeholder="ID do usuário"><button id="buscar" class="btn">Buscar</button></div><div id="error" class="error"></div><div style="overflow:auto"><table class="table"><thead><tr><th>Data</th><th>Usuário</th><th>Ação</th><th>Entidade</th><th>Registro</th><th>Antes</th><th>Depois</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script type="module">import { authSession } from './web/auth-session.js';import { auditoriaController } from './web/auditoria-controller.js';if(!authSession.requireAuth()){}const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const json=(v)=>v==null?'':JSON.stringify(v);async function load(){const e=document.getElementById('error');e.textContent='';try{const state=await auditoriaController.load({entidade:document.getElementById('entidade').value.trim(),registroId:document.getElementById('registro').value.trim(),usuarioId:document.getElementById('usuario').value.trim()});document.getElementById('rows').innerHTML=state.rows.length?state.rows.map(r=>`<tr><td>${esc(r.criadoEm)}</td><td>${esc(r.usuarioId)}</td><td>${esc(r.acao)}</td><td>${esc(r.entidade)}</td><td>${esc(r.registroId)}</td><td>${esc(json(r.antes))}</td><td>${esc(json(r.depois))}</td></tr>`).join(''):`<tr><td colspan="7" class="muted">Nenhum registro encontrado.</td></tr>`}catch(err){e.textContent=err.message}}document.getElementById('buscar').addEventListener('click',load);load();</script></body></html>
