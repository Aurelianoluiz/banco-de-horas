<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurações — Banco de Horas</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/web/responsive.css"></head><body><main class="main"><h1>Configurações</h1><p>Parâmetros armazenados no PostgreSQL.</p><section class="card"><label>Jornada Seg–Qui <input id="seg" value="540"></label><label>Jornada Sexta <input id="sex" value="480"></label><label>Tolerância <input id="tol" value="15"></label><button id="save">Salvar</button><p id="msg" aria-live="polite"></p></section><script type="module">const get=async()=>{const r=await fetch('/api/configuracoes');return r.json()};const rows=await get();const map=new Map(rows.map(x=>[x.chave,x.valor]));seg.value=map.get('cargaSegQuiMin')??540;sex.value=map.get('cargaSextaMin')??480;tol.value=map.get('toleranciaMin')??15;save.onclick=async()=>{for(const [k,v] of [['cargaSegQuiMin',Number(seg.value)],['cargaSextaMin',Number(sex.value)],['toleranciaMin',Number(tol.value)]]) await fetch('/api/configuracoes/'+encodeURIComponent(k),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({valor:v})});msg.textContent='Configurações salvas.'};</script></main></body></html>
