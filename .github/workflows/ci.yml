name: Banco de Horas CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate HTML
        run: |
          test -f index.html
          grep -q '<html' index.html
          grep -q 'Banco de Horas' index.html
      - name: Validate application files
        run: |
          test -f data-model.js
          test -f integration.js
          test -f importadores/apontamento-xls.js
          test -f rules/jornada.js
          test -f rules/compensacao.js
          test -f rules/fechamento.js
          test -f api/repository.js
          test -f api/services/apontamentos.js
          test -f api/services/colaboradores.js
          test -f api/services/auditoria.js
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run automated tests
        run: npm test
      - name: Check required project sections
        run: |
          grep -q 'Banco de Horas' index.html
          grep -q 'Férias' index.html
          grep -q 'Folgas' index.html
          grep -q 'Colaboradores' index.html
      - name: Repository summary
        run: |
          echo "Banco de Horas CI OK"
          echo "Files: $(find . -maxdepth 3 -type f | wc -l)"
