name: Deploy Web

on:
  workflow_run:
    workflows: ["Banco de Horas CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-contract:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate production entrypoint
        run: |
          test -f server.js
          test -f app-shell.html
          test -f .env.example
          npm run check
          npm test
      - name: Validate release version
        run: |
          test "$(node -p "require('./package.json').version")" = "1.0.0"
      - name: Publish deployment manifest
        run: |
          mkdir -p deploy
          cat > deploy/README.md <<'EOF'
          # Banco de Horas — deployment contract

          This application requires a Node.js runtime and PostgreSQL. The web shell is served by `server.js`.
          GitHub Pages is not a production target for this full-stack application because it cannot execute the Node.js API.
          Configure DATABASE_URL and AUTH_TOKEN_SECRET in the target hosting environment, then run `npm install && npm start`.
          Release: 1.0.0
          EOF
