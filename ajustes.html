<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajustes — Banco de Horas</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/web/responsive.css"></head><body><main class="main"><h1>Ajustes</h1><p>Correções manuais com auditoria.</p><form id="f" class="card"><input id="colaboradorId" placeholder="ID do colaborador" required><input id="data" type="date" required><input id="minutos" type="number" placeholder="Minutos" required><input id="motivo" placeholder="Motivo" required><button>Registrar ajuste</button><p id="msg" aria-live="polite"></p></form><section class="card"><button id="load">Atualizar</button><pre id="list"></pre></section><script type="module">const load=async()=>{const r=await fetch('/api/ajustes');const data=await r.json();list.textContent=JSON.stringify(data,null,2)};f.onsubmit=async e=>{e.preventDefault();const body={colaboradorId:colaboradorId.value,data:data.value,minutos:Number(minutos.value),motivo:motivo.value};const r=await fetch('/api/ajustes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});msg.textContent=r.ok?'Ajuste registrado.':(await r.json()).error;await load()};load.onclick=load;load();</script></main></body></html>
